<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/style.css">
    <!-- Text shimmer (the thinking orb pill's): agent strip, "Preparing video" -->
    <link rel="stylesheet" href="thinking_orb/shimmer.css">
    <!-- Left bar component styles (left_bar/left_bar.tsx) -->
    <link rel="stylesheet" href="left_bar/left_bar.css">
    <!-- Settings button component (settings/settings.tsx, in the left bar footer) -->
    <link rel="stylesheet" href="settings/settings.css">
    <!-- New Chat button component (chat/chat.tsx, in the left bar body) -->
    <link rel="stylesheet" href="chat/chat.css">
    <!-- Main content T-grid zone components (container/ holds all three) -->
    <link rel="stylesheet" href="container/screen/screen.css">
    <link rel="stylesheet" href="container/screen/globe_shell.css">
    <link rel="stylesheet" href="container/screen/run_bot.css">
    <link rel="stylesheet" href="container/user/user.css">
    <link rel="stylesheet" href="container/agent/agent.css">
    <link rel="stylesheet" href="container/agent/tracking_progress.css">
    <link rel="stylesheet" href="container/agent/run_reply.css">
    <link rel="stylesheet" href="container/agent/chain_bot.css">
    <!-- The sub-agents' boxes under the run's tool box (Computer use) -->
    <link rel="stylesheet" href="container/sub_agents/sub_agents.css">
    <link rel="stylesheet" href="container/chat_scroll/chat_scroll.css">
    <!-- Big center — the main container, always on: the frame around the
         zones (Skills mounts into it) -->
    <link rel="stylesheet" href="container/big_center_container/big_center_container.css">
    <!-- The .agent-note* rows (Shell use's notes under the terminal) and the
         .md Markdown styles every rendered reply uses -->
    <link rel="stylesheet" href="notes_stage/notes_stage.css">
    <!-- Chat input (bottom text box) component -->
    <link rel="stylesheet" href="chat_input/chat_input.css">
    <link rel="stylesheet" href="chat_input/mode_bot.css">
    <!-- Agent mode — pill + floating menu at the composer's bottom-left -->
    <link rel="stylesheet" href="agent_mode/agent_mode.css">
    <!-- Skills — scroll icon just right of the Computer/Mobile use picker -->
    <link rel="stylesheet" href="skills/skills.css">
    <!-- Connect Device — Settings section (iPhone/Android) -->
    <link rel="stylesheet" href="device_connect/device_connect.css">
    <!-- Memory ring — context gauge in the composer, just right of the Skills icon -->
    <link rel="stylesheet" href="memory_bar/memory_bar.css">
    <!-- CLI container — full-width panel that slides up from the bottom on cli_await -->
    <link rel="stylesheet" href="cli/cli_stage.css">
    <!-- Live coder card rendered inside that container (one per CLI agent) -->
    <link rel="stylesheet" href="cli/cli_container/coder_card.css">
    <!-- The intro splash, drawn in #splashOverlay (intro_animation.tsx) -->
    <link rel="stylesheet" href="intro_animation.css">
</head>
<body>
    <!-- The page: index.tsx (React + TSX), built into index.js (npm run
         build). It draws the whole page into #root right here, before the
         scripts below run, so they find the same ids and classes as before
         and keep driving them. The stylesheets above style it unchanged. -->
    <div id="root"></div>
    <script src="index.js"></script>

    <!-- Left bar: wires the bar (left_bar.tsx), reveals it on splashDone -->
    <script src="left_bar/left_bar.js"></script>
    <!-- Settings button: wires the cog (settings.tsx), emits 'open-settings' -->
    <script src="settings/settings.js"></script>
    <!-- New Chat button: wires it (chat.tsx), builds the chat list -->
    <script src="chat/chat.js"></script>
    <!-- The live turn's zones (container/*/*.tsx): their scripts -->
    <script src="container/screen/screen.js"></script>
    <!-- Screen container overlays: web globe + shell terminal swap over the screenshot -->
    <script src="container/screen/globe_shell.js"></script>
    <!-- The run's screen stage: the moving background behind its screenshots -->
    <script src="container/screen/run_bot.js"></script>
    <script src="container/user/user.js"></script>
    <script src="container/agent/agent.js"></script>
    <!-- Tracking progress: the scratchpad stream in the bottom container's right half -->
    <script src="container/agent/tracking_progress.js"></script>
    <!-- Run reply: the done message in the bottom container once a run ends -->
    <script src="container/agent/run_reply.js"></script>
    <!-- The run's bot: comes in big in the bottom container, then stands at its left -->
    <script src="container/agent/chain_bot.js"></script>
    <!-- The small bots (the run's, by the done message, Shell use's answers) blink like the bot pages -->
    <script src="container/agent/bot_blink.js"></script>
    <!-- The chat's scroll: earlier turns, the edge fades, the glide to a new turn -->
    <script src="container/chat_scroll/chat_scroll.js"></script>
    <!-- The sub-agents' boxes: one per browser, iOS or coder sub-agent, under the run's tool box -->
    <script src="container/sub_agents/sub_agents.js"></script>
    <!-- Thinking orb engine (window.ThinkingOrb): the agent strip's orb -->
    <script src="thinking_orb/thinking_orb.js"></script>
    <!-- Chat input (bottom text box): wires it (chat_input.tsx), fires 'chatinput:ready' -->
    <script src="chat_input/chat_input.js"></script>
    <!-- The Wireless / Wired toggle: how the phone pick connects (window.phoneLink) -->
    <script src="chat_input/link_toggle.js"></script>
    <!-- The mode's bot: comes in big when a mode is picked, stays on the chat box in a fresh chat -->
    <script src="chat_input/mode_bot.js"></script>
    <!-- Agent mode: wires the picker (agent_mode.tsx) on 'chatinput:ready' -->
    <script src="agent_mode/agent_mode.js"></script>
    <!-- Skills: wires the icon (skills.tsx) and the stage (skills_stage.tsx) -->
    <script src="skills/skills.js"></script>
    <!-- The Android pick's phone helper (window.androidSession). Before ios_session.js:
         its menu listener must run first (see the file's header) -->
    <script src="agent_mode/android_session.js"></script>
    <!-- Parked: the proven iOS connect logic (window.iosSession) — attached once the design is final -->
    <script src="agent_mode/ios_session.js"></script>
    <!-- Connect Device: wires the Settings iPhone/Android device-connect section -->
    <script src="device_connect/device_connect.js"></script>
    <!-- Memory ring loader (defines window.updateMemoryBar before script.js) -->
    <script src="memory_bar/memory_bar.js"></script>
    <script src="script.js"></script>
    <!-- CLI container — the coder card component, then the stage orchestrator. Both load
         AFTER script.js so the orchestrator's window.cli* hooks override the old chat-box
         CLI rendering. coder_card.js must precede cli_stage.js (it defines CliCoderCard);
         tool_icons.js precedes coder_card.js (it defines the action-icon engine). -->
    <script src="cli/cli_container/tool_icons.js"></script>
    <script src="cli/cli_container/coder_card.js"></script>
    <script src="cli/cli_stage.js"></script>
</body>
</html>
