# The Android side as ONE crate, the same shape as ../web: Cargo.toml,
# Cargo.lock, build.rs and lib.rs here, the sources in their own folders
# beside them (agent/, controller/, tool_registry/, tree/), one file each,
# no src/ and no mod.rs (lib.rs declares the folders). One cargo build gives
# agent_native, the whole side as a Python extension module (PyO3 cdylib):
# the agent, and the phone reader (tree/element.rs) it scans with, which
# tree/test.py drives by hand through the same module. agent/__init__.py
# builds it and copies it beside itself as agent_native.so, no maturin.

[package]
name = "agent_native"
version = "0.1.0"
edition = "2021"

# Standalone crate, not part of any workspace.
[workspace]

[lib]
name = "agent_native"
crate-type = ["cdylib"]
path = "lib.rs"

[build-dependencies]
# Emits the macOS -undefined dynamic_lookup link args (see build.rs) that
# maturin would otherwise supply.
pyo3-build-config = "0.29"

[dependencies]
# -- the agent (agent/, tool_registry/, controller/) ---------------------
# abi3-py310: one .so works on every CPython >= 3.10, so the user's Python
# can move without a relink.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
# serde_json::Value <-> Python objects at the LLM/controller boundary.
pythonize = "0.29"
# preserve_order: Python dicts are insertion-ordered; persisted transcript
# JSON must not reshuffle keys relative to the Python implementation.
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
chrono = "0.4"
# -- the phone reader (tree/element.rs) ----------------------------------
# Pure-Rust JPEG decoder for the phone helper's screenshots (the scan draws
# its marks on them; the video player looks at them). Its only dependency is
# zune-core; the web crate locks the same version through image.
zune-jpeg = "0.5"
# Pure-Rust JPEG encoder for the marked screenshot, and base64 for the one
# the model gets.
jpeg-encoder = "0.7"
base64 = "0.22"
# Reads uiautomator's XML tree (no dependencies of its own). Pinned: 0.21.2
# was a day old when this was written.
roxmltree = "=0.21.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
