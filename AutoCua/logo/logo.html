<style>
  /* The agent browser's blank tab: AutoCua's logo in the middle, and the
     Web use bot coming in under it like the Computer use bot under the
     title in the app's intro (ui/intro_animation.html), to stand on the
     bottom edge. Its three layers (body, eyes, shine) are the app's
     ui/bots/webuse* at 884x1224, inline like the icon. */
  html, body { margin: 0; height: 100%; background: #FFFFFF; }
  body { display: grid; place-items: center; }
  .logo { width: min(19vmin, 170px); height: auto; display: block; }
  .lift { position: fixed; inset: 0; opacity: 0; pointer-events: none; }
  .row  { position: absolute; left: 0; right: 0; transform-origin: 50% 100%; }
  .slot { position: absolute; bottom: 0; left: 50%; }
  .bot  { position: absolute; inset: 0;
          -webkit-mask-image: linear-gradient(#000 66%, transparent 100%);
                  mask-image: linear-gradient(#000 66%, transparent 100%); }
  .bot img { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
             -webkit-user-select: none; user-select: none; -webkit-user-drag: none; }
  .bot .eyes { opacity: 0; transform-origin: 50% 24.74%; }
</style>
</head>

    var drop = layout();
    anims = [
      lift.animate([{ opacity: 0 }, { opacity: 1 }], { delay: FIRST, duration: FADE, fill: 'both' }),
      row.animate(rowFrames(), { delay: FIRST, duration: SHRINK_AT + SHRINK, fill: 'both' }),
      row.animate([{ filter: 'blur(6px)' }, { filter: 'blur(0px)' }], { delay: FIRST, duration: GROW, easing: EASE_SETTLE, fill: 'backwards' }),
      rise = lift.animate([{ transform: 'translateY(' + drop + 'px)' }, { transform: 'translateY(0px)' }], { delay: FIRST + SHRINK_AT, duration: SHRINK, easing: EASE_EXPO, fill: 'both' }),
      wake()
    ];
    if (t > 0) anims.forEach(function (a) { a.currentTime = t; });
    S.timer = setTimeout(function () { if (mine()) { settle(); idle(); } }, Math.max(0, END - t));
  }

  /* The end of the entrance, held by plain styles; the eyes' animation must
     go, or its fill would hide the blinks (ui/chat_input/mode_bot.js). */
  function settle() {
    anims.forEach(function (a) { a.cancel(); });
    anims = [];
    rise = null;
    layout();
    lift.style.opacity = '1';
    row.style.transform = 'scale(' + (1 / B) + ')';
    eyes.style.opacity = '1';
  }

  /* The page's blink (bot_blink.js): 0.78 s, shut for a beat, 3 to 5.4 s
     apart, a double blink 28% of the time; styles only while it blinks. */
  function smooth(u) { u = u < 0 ? 0 : u > 1 ? 1 : u; return u * u * u * (u * (u * 6 - 15) + 10); }
  function lid(u) {
    var k = u < 0.42 ? smooth(u / 0.42) : u < 0.52 ? 1 : 1 - smooth((u - 0.52) / 0.48);
    return 1 - 0.90 * k;
  }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function idle() {
    if (reduced) return;
    if (!S.next) S.next = performance.now() + rnd(1500, 4500);
    S.timer = setTimeout(function () { if (mine()) blink(performance.now()); }, Math.max(0, S.next - performance.now()));
  }
  function blink(at) {
    S.next = at + LID + 3000;
    (function frame(now) {
      if (!mine()) return;
      var u = (now - at) / LID;
      if (u < 1) {
        eyes.style.transform = 'scaleY(' + lid(u).toFixed(3) + ')';
        S.raf = requestAnimationFrame(frame);
        return;
      }
      eyes.style.removeProperty('transform');
      if (S.dbl) { S.dbl = false; S.next = now + 200; }
      else { S.next = now + rnd(3000, 5400); S.dbl = Math.random() < 0.28; }
      idle();
    })(at);
  }

  function go() {
    if (!mine() || S.t0 != null) return;
    S.t0 = performance.now();
    try {
      if (reduced) { settle(); idle(); } else entrance(0);
    } catch (e) {
      settle();
    }
  }

  try {
    if (S.t0 != null) {
      var t = performance.now() - S.t0;
      if (reduced || t >= END) { settle(); idle(); } else entrance(t);
    } else {
      Promise.all(imgs.map(function (im) {
        return im.decode ? im.decode().catch(function () {}) : null;
      })).then(go);
      S.gate = setTimeout(go, DECODE_MAX);
    }
  } catch (e) {
    lift.style.opacity = '1';
  }
})();
</script>
