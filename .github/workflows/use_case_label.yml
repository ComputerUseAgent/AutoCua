# The issue forms ask "Who is this for?" (Personal / Corporate work). A form
# can carry only fixed labels, so the answer is turned into a label here, and
# that is what shows in the issue's sidebar. Corporate stays at the front of
# the queue. Runs again on an edit, so a changed answer swaps the label.
name: Label the use case

on:
  issues:
    types: [opened, edited]

jobs:
  label:
    runs-on: ubuntu-latest
    # Only this job, and only issues: the repo's default token stays read-only.
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const match = (issue.body || "")
              .match(/###\s*Who is this for\?\s*\r?\n+([^\r\n]+)/i);
            if (!match) { core.info("No use-case answer in this issue."); return; }

            const answer = match[1].trim();
            if (/^_no response_$/i.test(answer)) { core.info("Left blank."); return; }

            const want  = /^corporate/i.test(answer) ? "corporate" : "personal";
            const other = want === "corporate" ? "personal" : "corporate";
            const META = {
              corporate: { color: "0E8A16", description: "Company use: fixed first" },
              personal:  { color: "C5DEF5", description: "Personal use" },
            };

            // The label may not exist yet on a fresh repo.
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: want });
            } catch (err) {
              if (err.status !== 404) throw err;
              await github.rest.issues.createLabel({
                ...context.repo, name: want, ...META[want],
              });
            }

            // An edited answer must not leave both labels on the issue.
            if ((issue.labels || []).some((l) => l.name === other)) {
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo, issue_number: issue.number, name: other,
                });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
            }

            await github.rest.issues.addLabels({
              ...context.repo, issue_number: issue.number, labels: [want],
            });
            core.info(`Labelled ${want}.`);
