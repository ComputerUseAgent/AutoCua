name: Bug report
description: Something in AutoCua went wrong.
labels: ["bug"]
body:
  - type: dropdown
    id: use-case
    attributes:
      label: Who is this for?
      description: >-
        Corporate reports are fixed faster: they go to the front of the queue
        and the issue is labelled so it stays there.
      options:
        - Personal
        - Corporate work
      default: 1
    validations:
      required: true

  - type: input
    id: company
    attributes:
      label: Company name
      description: Write NA if this is for personal use.
      placeholder: Acme Ltd, or NA if personal
    validations:
      required: true

  - type: checkboxes
    id: showcase
    attributes:
      label: Showing your name
      description: >-
        Optional, and it helps AutoCua a lot: teams look for other teams
        already using it.
      options:
        - label: AutoCua may show our company name on its website as a team that trusts it.
          required: false

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - computer use
        - coder / shell use
        - web use
        - mobile use, iOS simulator
        - mobile use, iOS hardware
    validations:
      required: true

  - type: dropdown
    id: started
    attributes:
      label: How it was started
      options:
        - Straight from the terminal
        - Through the UI
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Please also say which model you used, and the provider it came from.
    validations:
      required: true

  - type: textarea
    id: conversation
    attributes:
      label: Conversation
      description: |
        Drag the conversation in here.

        In the UI: the **⋯** menu next to the chat → **Download conversation**.
        From the terminal: run with `save_conversation=True` and take the `conversation/` folder.

        ⚠️ **Please erase all sensitive data before you upload it.**
